# docker compose run --rm agent "Why migrate from Prisma Cloud to Cortex Cloud?"
#
# By default the agent talks to Ollama on the HOST (http://host.docker.internal:11434).
# To run Ollama in a container instead:
#   docker compose --profile ollama up -d ollama
#   docker compose exec ollama ollama signin        # needed for :cloud models
#   CONTAINER_OLLAMA_BASE_URL=http://ollama:11434/v1 docker compose run --rm agent "..."
services:
  agent:
    build: .
    # Run as your host user so the container can write to ./outputs, ./logs
    # and ./fetched (set HOST_UID/HOST_GID in .env: `id -u`, `id -g`).
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    image: ${IMAGE:-docker-agent-prisma-cortex:latest}
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container "localhost" is the container itself, so this
      # overrides the OLLAMA_BASE_URL from .env.
      OLLAMA_BASE_URL: ${CONTAINER_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./fetched:/app/fetched
    read_only: true
    tmpfs:
      - /tmp
      - /home/agent
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  ollama:
