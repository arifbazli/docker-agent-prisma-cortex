agents:
  root:
    model: ollama/nemotron-3-super:cloud
    description: Coordinator
    instruction: |
      You get a topic. Follow these steps:
      1. Ask the writer for a 3-sentence explanation.
      2. Ask the critic to fact-check it against Wikipedia.
      3. If the critic reports mistakes, ask the writer to rewrite the
         explanation, fixing exactly those mistakes.
      4. Reply only with the final, corrected explanation.
    sub_agents: [writer, critic]

  writer:
    model: ollama/gemma4:31b-cloud
    description: Writes simple explanations
    instruction: |
      Explain the topic in 3 short sentences for a beginner.

  critic:
    model: ollama/nemotron-3-super:cloud
    description: Fact-checks explanations using Wikipedia
    instruction: |
      First use wikipedia_search to find the right article title,
      then use wikipedia_summary to read it. Compare the text you were
      given to the summary. Say "OK" if it is accurate, otherwise list
      the mistakes in one short line.
    toolsets:
      - type: api
        api_config:
          name: wikipedia_search
          method: GET
          endpoint: "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=3&format=json"
          instruction: Search Wikipedia article titles and snippets
          args:
            query:
              type: string
              description: The search query
          required: ["query"]
          headers:
            User-Agent: "docker-agent-lab/1.0 (personal learning project)"
      - type: api
        api_config:
          name: wikipedia_summary
          method: GET
          endpoint: "https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}"
          instruction: Get the summary of a Wikipedia article by exact title (use underscores for spaces)
          args:
            title:
              type: string
              description: Exact article title, for example OS-level_virtualization
          required: ["title"]
          headers:
            User-Agent: "docker-agent-lab/1.0 (personal learning project)"
