name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOCKER_AGENT_VERSION: v1.152.0
  DOCKER_AGENT_SHA256: bb591b3b73e6ce06b24a19732371fefb5a99f001813c94e146a4b1474135c8e8

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cloud-only models (no model downloads anywhere)
        run: |
          if git grep -n -i "ollama pull" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::'ollama pull' found: this repository uses Ollama cloud models only"; exit 1
          fi
      - name: shellcheck
        run: shellcheck -x scripts/*.sh bench/*.sh bench/guardrail/*.sh
      - name: yamllint
        run: pip install --quiet yamllint && yamllint -s agents/ compose.yaml .github/
      - name: generated configs are up to date
        run: python3 scripts/gen-configs.py --check
      - name: unit tests (incl. model guard; no model calls)
        run: python3 -m unittest discover -s tests -v
      - name: guardrail golden profiles + mutation checks (no model calls)
        run: bench/guardrail/check-golden.sh
      - name: install docker-agent
        run: |
          curl -fsSL -o /usr/local/bin/docker-agent \
            "https://github.com/docker/docker-agent/releases/download/${DOCKER_AGENT_VERSION}/docker-agent-linux-amd64"
          echo "${DOCKER_AGENT_SHA256}  /usr/local/bin/docker-agent" | sha256sum -c -
          chmod +x /usr/local/bin/docker-agent
      - name: validate agent configs
        env:
          TELEMETRY_ENABLED: "false"
          OLLAMA_BASE_URL: http://localhost:11434/v1
          RESEARCH_MODEL: placeholder
          JUDGE_MODEL: placeholder
          WRITER_MODEL: placeholder
          ROUTER_MODEL: placeholder
          SPECIALIST_MODEL: placeholder
          REVIEWER_MODEL: placeholder
        run: |
          for f in agents/*.yaml; do
            echo "== $f"; docker-agent debug config "$f" > /dev/null
          done
          printf 'PRISMA_API_URL=https://api.prismacloud.io\nCORTEX_FQDN=example.xdr.us.paloaltonetworks.com\n' > .env
          scripts/gen-tenant-config.sh
          docker-agent debug config agents/tenant-readonly.local.yaml > /dev/null
          rm .env

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:latest
      - name: smoke test (no model needed)
        run: |
          docker build -q -t local/agent .
          docker run --rm --entrypoint docker-agent local/agent version
          docker run --rm --entrypoint python3 local/agent scripts/gen-configs.py --check
