name: seed-urls
# Documentation pages move. Check every seed URL nightly so a broken seed
# is caught before it silently degrades the research step.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-seeds.sh
