name: seed-urls
# Documentation pages move. Check every seed URL nightly so a broken seed
# is caught before it silently degrades the research step.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Also on pull requests that change start pages; non-blocking because the
  # result depends on third-party sites being up.
  pull_request:
    paths:
      - "seeds/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-seeds.sh
