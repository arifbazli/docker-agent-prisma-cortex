<text x="20" y="88" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"></text>
<text x="20" y="106" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"># PANW Briefing: Why migrate to Cortex Cloud</text>
<text x="20" y="124" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"></text>
<text x="20" y="142" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">Bottom line: Palo Alto documents that Cortex Cloud offers a platform-based, proactive security approach with</text>
<text x="20" y="160" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">  real-time capabilities, AI assistance, and consolidated reporting.</text>
<text x="20" y="178" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"></text>
<text x="20" y="196" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">Why move (per Palo Alto documentation)</text>
<text x="20" y="214" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">- Cortex Cloud delivers a platform-based, proactive security approach. [1]</text>
<text x="20" y="232" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">- Cortex Cloud provides real-time cloud security that enables investigation and remediation. [1]</text>
<text x="20" y="250" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">- Cortex Cloud includes an AI Copilot across the platform to simplify day-to-day activities. [1]</text>
<text x="20" y="268" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"></text>
<text x="20" y="286" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">How migration works (per Palo Alto documentation)</text>
<text x="20" y="304" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">- The Upgrade Helper provides a gradual and flexible upgrade experience from Prisma Cloud to Cortex Cloud.</text>
